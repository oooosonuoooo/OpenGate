name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ github.job }}-cargo-downloads-${{ hashFiles('Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --workspace --release
      - run: cargo install cargo-audit --locked && cargo audit
      - run: scripts/package-linux.sh 0.1.0 target/release/opengate
      - uses: actions/upload-artifact@v4
        with: { name: opengate-linux-deb, path: target/packages/*.deb }
  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - run: dnf -y install ca-certificates findutils gcc gcc-c++ git make openssl-devel pkgconf-pkg-config rpm-build systemd-rpm-macros tar gzip zstd
      - name: Cache Cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ github.job }}-cargo-downloads-${{ hashFiles('Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --workspace --release
      - run: scripts/package-linux.sh 0.1.0 target/release/opengate
      - uses: actions/upload-artifact@v4
        with: { name: opengate-linux-rpm, path: target/packages/*.rpm }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ github.job }}-cargo-downloads-${{ hashFiles('Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --workspace --release
      - run: cargo install cargo-audit --locked; cargo audit
      - run: dotnet tool install --global wix --version 4.*
      - shell: pwsh
        run: wix extension add WixToolset.Util.wixext
      - shell: pwsh
        run: wix build -arch x64 packaging/windows/OpenGate.wxs -ext WixToolset.Util.wixext -d OpenGateBinary="$PWD/target/release/opengate.exe" -d ProductVersion="0.1.0" -o target/OpenGate.msi
      - uses: actions/upload-artifact@v4
        with: { name: opengate-windows-msi, path: target/OpenGate.msi }
