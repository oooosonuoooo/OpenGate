name: CI
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      - run: cargo install cargo-audit --locked && cargo audit
      - run: scripts/package-linux.sh 0.1.0 target/release/opengate
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      - run: dotnet tool install --global wix
      - shell: pwsh
        run: wix build packaging/windows/OpenGate.wxs -d OpenGateBinary="$PWD/target/release/opengate.exe" -o target/OpenGate.msi
      - uses: actions/upload-artifact@v4
        with: { name: opengate-windows-msi, path: target/OpenGate.msi }
