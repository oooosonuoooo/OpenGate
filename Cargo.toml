[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
data-encoding = "2"
libp2p = { version = "0.56", features = ["tokio", "tcp", "quic", "noise", "yamux", "dns", "identify", "ping", "mdns", "autonat", "relay", "dcutr", "macros", "serde", "ed25519"] }
libp2p-stream = "0.4.0-alpha"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
directories = "6"
toml = "0.9"
fs2 = "0.4"
clap = { version = "4", features = ["derive", "env"] }
portable-pty = "0.9"
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = "0.30.2"
libc = "0.2"
tempfile = "3"
cap-std = "3"
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Threading"] }
opengate-protocol = { path = "crates/opengate-protocol" }
opengate-security = { path = "crates/opengate-security" }
opengate-core = { path = "crates/opengate-core" }
opengate-network = { path = "crates/opengate-network" }
opengate-terminal = { path = "crates/opengate-terminal" }
opengate-files = { path = "crates/opengate-files" }
opengate-tunnel = { path = "crates/opengate-tunnel" }
opengate-service = { path = "crates/opengate-service" }

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[patch.crates-io]
libp2p-dns = { path = "vendor/libp2p-dns-0.44.0" }
libp2p-mdns = { path = "vendor/libp2p-mdns-0.48.0" }
libp2p-relay = { path = "vendor/libp2p-relay-0.21.1" }
